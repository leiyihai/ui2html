<script>

var W = 1280, H = 720;
var ELEMS = [{"idx": 0, "name": "背景", "file": "背景.png", "anchor": "tl", "x": 0.0, "y": 0.0, "w": 1280, "h": 720, "z": 0}, {"idx": 1, "name": "摇杆", "file": "摇杆.png", "anchor": "bl", "x": 35.0, "y": -312.0, "w": 244, "h": 243, "z": 1}, {"idx": 2, "name": "跳跃", "file": "跳跃.png", "anchor": "br", "x": -193.0, "y": -231.0, "w": 100, "h": 100, "z": 2}, {"idx": 3, "name": "攻击", "file": "攻击.png", "anchor": "cr", "x": -327.0, "y": 22.0, "w": 100, "h": 100, "z": 3}, {"idx": 4, "name": "镜头", "file": "镜头.png", "anchor": "br", "x": -274.0, "y": -80.0, "w": 64, "h": 64, "z": 4}, {"idx": 5, "name": "底栏", "file": "底栏.png", "anchor": "bl", "x": 306.0, "y": -80.0, "w": 668, "h": 67, "z": 5}, {"idx": 6, "name": "血条", "file": "血条.png", "anchor": "bc", "x": -250.0, "y": -108.0, "w": 245, "h": 24, "z": 6}, {"idx": 7, "name": "buff", "file": "buff.png", "anchor": "bc", "x": -249.0, "y": -151.0, "w": 194, "h": 29, "z": 7}, {"idx": 8, "name": "设置", "file": "设置.png", "anchor": "tl", "x": 18.0, "y": 8.0, "w": 64, "h": 64, "z": 8}, {"idx": 9, "name": "聊天", "file": "聊天.png", "anchor": "tl", "x": 84.0, "y": 8.0, "w": 64, "h": 64, "z": 9}, {"idx": 10, "name": "镜头", "file": "镜头.png", "anchor": "tl", "x": 150.0, "y": 8.0, "w": 64, "h": 64, "z": 10}, {"idx": 11, "name": "表情", "file": "表情.png", "anchor": "tl", "x": 216.0, "y": 8.0, "w": 64, "h": 64, "z": 11}, {"idx": 12, "name": "摄像机", "file": "摄像机.png", "anchor": "tl", "x": 282.0, "y": 8.0, "w": 64, "h": 64, "z": 12}, {"idx": 13, "name": "荣誉之路", "file": "荣誉之路.png", "anchor": "tl", "x": 92.0, "y": 81.0, "w": 155, "h": 69, "z": 13}, {"idx": 14, "name": "头像", "file": "头像.png", "anchor": "tl", "x": 14.0, "y": 73.0, "w": 75, "h": 83, "z": 14}, {"idx": 15, "name": "通行证", "file": "通行证.png", "anchor": "tl", "x": 350.0, "y": 5.0, "w": 162, "h": 67, "z": 15}, {"idx": 16, "name": "货币栏", "file": "货币栏.png", "anchor": "tr", "x": -227.0, "y": 7.0, "w": 208, "h": 64, "z": 16}, {"idx": 17, "name": "战斗商店", "file": "战斗商店.png", "anchor": "tl", "x": 250.0, "y": 86.0, "w" var BG = "#b2cefb";
var ANCHOR = { tl:[0,0], tc:[.5,0], tr:[1,0], cl:[0,.5], cc:[.5,.5], cr:[1,.5], bl:[0,1], bc:[.5,1], br:[1,1] };
function rectOf(e, cw, ch, s) {
  var a = ANCHOR[e.anchor] || ANCHOR.cc;
  return { l: a[0]*cw + e.x*s, t: a[1]*ch + e.y*s, w: e.w*s, h: e.h*s };
}
function render(cw, ch, s) {
  ELEMS.forEach(function (e) {
    var el = document.getElementById("el-" + e.idx);
    if (!el) return;
    var r = rectOf(e, cw, ch, s);
    el.style.left = r.l + "px"; el.style.top = r.t + "px";
    el.style.width = r.w + "px"; el.style.height = r.h + "px";
  });
}

(function () {
  var stage = document.getElementById("stage");
  var cw = 0, ch = 0, scale = 1;
  var vv = window.visualViewport || window;
  function fit() {
    // 容器 = 视口，元素按锚点渲染；再整体等比缩放以看清全貌
    scale = Math.min(vv.width / W, vv.height / H);
    cw = W * scale; ch = H * scale;
    stage.style.transform = "scale(" + scale + ")";
    stage.style.left = (vv.width - cw) / 2 + "px";
    stage.style.top = (vv.height - ch) / 2 + "px";
    stage.style.width = W + "px"; stage.style.height = H + "px";
    render(W, H, 1);   // 容器=设计尺寸，锚点偏移按设计稿；缩放交给 stage
  }
  vv.addEventListener && vv.addEventListener("resize", fit);
  window.addEventListener("orientationchange", fit);
  fit();
})();

</script>
</body>
